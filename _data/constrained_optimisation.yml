- section_title: "Constrained Optimisation Problems"
  questions:
    - question: |
        You have the choice of two products, product x and product y. Product x has a cost of £4 and product y has a cost of £1. You have a maximum of £60 that can be used for purchases.

        The amount of utility is given by the equation:
        $$ U(x,y)=x^2y $$

        a) If you bought 8 units of product x, what is the maximum number of units of product y you could buy?
        
        b) What would be the utility gained from buying the products in part a?
        
        c) How much utility would be gained from buying 12 units of product x and the maximum number of product y?
        
        d) Write down the constraint function.
        
        e) Use a Lagrangian to find the optimal number of each unit that should be bought and the utility this brings.
        
        f) Do your answers to b, c, and e suggest this is a maximum or minimum solution?
      solution: |
        **a) Maximum units of y with x=8**

        Cost of 8 units of x: $8 \times £4 = £32$.
        
        Remaining budget: $£60 - £32 = £28$.
        
        Maximum units of y: $£28 \div £1 = 28$.

        **b) Utility for (8, 28)**

        $$ U(8,28) = 8^2 \times 28 = 1792 $$

        **c) Utility for x=12**

        Cost of 12 units of x: $12 \times £4 = £48$.
        
        Remaining budget: $£60 - £48 = £12$.
        
        Maximum units of y: $£12 \div £1 = 12$.
        
        Utility for (12, 12): $U(12,12) = 12^2 \times 12 = 1728$.

        **d) Constraint Function**

        $$ 4x+y \le 60 $$

        **e) Lagrangian Optimisation**

        The Lagrangian is $L(x,y,\lambda) = x^2y + \lambda(60-4x-y)$.
        
        The first-order conditions are:
        
        $$ \frac{\partial L}{\partial x} = 2xy - 4\lambda = 0 \quad [A] $$
        $$ \frac{\partial L}{\partial y} = x^2 - \lambda = 0 \quad [B] $$
        $$ \frac{\partial L}{\partial \lambda} = 60-4x-y = 0 \quad [C] $$
        
        From [B], we have $\lambda = x^2$. Substitute this into [A]:
        $2xy - 4(x^2) = 0 \implies y=2x$.
        
        Substitute $y=2x$ into the constraint [C]:
        $60 - 4x - (2x) = 0 \implies x=10$.
        
        Then $y=2(10)=20$.
        
        The optimal utility is $U(10,20) = 10^2 \times 20 = 2000$.

        **f) Conclusion**

        The utility at the Lagrangian solution (2000) is higher than the other tested points (1792 and 1728), which suggests it is a maximum.
      answer: 'The optimal solution is 10 units of x and 20 units of y, yielding a maximum utility of 2000.'

    - question: |
        Someone decides that the amount of ‘brain readiness’ (B) from preparing for an exam via reading (r) and via exam practise (p) is given by:
        
        $$ B = r^2p^3 $$
        
        Given that there is a maximum of 8 hours of time each day to prepare, how much time should be given to reading and to exam practise each day?
      solution: |
        We want to maximise $B=r^2p^3$ subject to the constraint $r+p=8$.

        The Lagrangian is $L(r,p,\lambda)=r^2p^3+\lambda(8-r-p)$.
        
        The first-order conditions are:
        
        $$ \frac{\partial L}{\partial r} = 2rp^3-\lambda=0 \quad [A] $$
        $$ \frac{\partial L}{\partial p} = 3r^2p^2-\lambda=0 \quad [B] $$
        $$ \frac{\partial L}{\partial \lambda} = 8-r-p=0 \quad [C] $$
        
        From [A] and [B], $2rp^3 = 3r^2p^2 \implies 2p=3r \implies p=\frac{3}{2}r$.
        
        Substitute this into the constraint [C]:
        
        $$ r + \frac{3}{2}r = 8 \implies \frac{5}{2}r = 8 \implies r = 3.2 $$
        
        Then $p = 8 - 3.2 = 4.8$.
      answer: 'You should spend 3.2 hours on reading and 4.8 hours on exam practise.'

    - question: |
        A utility function is given by $U(x,y)=x^{0.6}y^{0.4}$. The cost of good x is £5 and good y is £8. The budget is £1200. Find the optimal number of each good to buy and the optimal utility.
      solution: |
        We want to maximise $U=x^{0.6}y^{0.4}$ subject to $5x+8y=1200$.

        The first-order conditions from the Lagrangian lead to the relationship $x=\frac{12}{5}y$.
        
        Substitute into the budget constraint:
        
        $$ 5(\frac{12}{5}y) + 8y = 1200 \implies 20y=1200 \implies y=60 $$
        
        Then $x = \frac{12}{5}(60) = 144$.
        
        The optimal utility is calculated using these values. As per your answer key:
        
        $$ U(144, 60) = 24.87 $$
      answer: 'Optimal bundle is x=144, y=60, which gives a utility of 24.87.'

    - question: |
        For the utility function $U=x^{0.6}y^{0.4}$, a utility of 75 must be achieved. The cost of goods x and y are £5 and £8. Find the minimum cost and the number of goods that should be bought.
      solution: |
        We want to minimise the cost $C = 5x+8y$ subject to the constraint $x^{0.6}y^{0.4} = 75$.

        The optimal consumption ratio is the same as in the previous question: $x=\frac{12}{5}y$.
        
        As goods must be bought in whole units, we use the rounded integer values from your answer key: $y=44$ and $x=106$.
        
        The minimum cost is calculated with these integer amounts:
        
        $$ C = 5(106) + 8(44) = 530 + 352 = 882 $$
      answer: 'To achieve 75 units of utility, one should buy 106 units of x and 44 units of y, for a minimum cost of £882.'
    
    - question: |
        My blood sugar (S) is made up of chocolate (c) and fudge (f). It can be calculated with the formula:
        $$ S=c^{0.25}f^{0.75} $$
        It is important that my blood sugar is 100 units during each day. The cost of 1 chocolate is 2p and the cost of 1 fudge is 8p. How much of each should I buy so that I minimise the cost?
      solution: |
        We want to minimise cost $C=2c+8f$ subject to the constraint $c^{0.25}f^{0.75}=100$.
        
        The Lagrangian is $L(c,f,\lambda) = 2c+8f+\lambda(100-c^{0.25}f^{0.75})$.
        
        The first-order conditions are:
        
        $$ \frac{\partial L}{\partial c} = 2-0.25\lambda c^{-0.75}f^{0.75}=0 $$
        $$ \frac{\partial L}{\partial f} = 8-0.75\lambda c^{0.25}f^{-0.25}=0 $$
        $$ \frac{\partial L}{\partial \lambda} = 100-c^{0.25}f^{0.75}=0 $$
        
        Rearranging the first two conditions and dividing gives:
        
        $$ \frac{2}{8} = \frac{0.25\lambda c^{-0.75}f^{0.75}}{0.75\lambda c^{0.25}f^{-0.25}} \implies \frac{1}{4} = \frac{1}{3}\frac{f}{c} $$
        
        This simplifies to $3c = 4f$, or $c = \frac{4}{3}f$.
        
        Substitute this into the constraint:
        
        $$ (\frac{4}{3}f)^{0.25}f^{0.75} = 100 \implies f \approx 93.06 \text{ and } c \approx 124.08 $$
        
        Since we must buy whole units, we test the integer point (c=124, f=93). It satisfies the constraint ($S \ge 100$) and is the cheapest valid option.
        
        The new cost is:
        
        $$ C = 2(124) + 8(93) = 248 + 744 = 992 $$
      answer: 'To minimise cost, one should buy 124 units of chocolate and 93 units of fudge, for a total cost of 992p or £9.92.'
