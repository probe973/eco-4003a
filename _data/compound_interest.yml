- section_title: "Compound Interest Calculations"
  questions:
    - question: |
        A saver invests £5000 in a bank account that offers a rate of interest of 4%. Calculate the amount of savings after 5 years (to the nearest penny) if:
      is_table_question: true
      table_items:
        - item: "Interest is not compounded (simple interest)"
          solution: |
            Using the simple interest formula $A = P(1+rt)$:
            
            $$
            \begin{align*}
            A &= 5000(1 + 0.04 \times 5) \\
            A &= 6000
            \end{align*}
            $$
          answer: '£6000.00'
        - item: "Interest is compounded yearly"
          solution: |
            Using the formula $A=P(1+r/n)^{nt}$ with $P=5000, r=0.04, t=5, n=1$:

            $$
            \begin{align*}
            A &= 5000(1.04)^5 \\
            A &\approx 6083.26
            \end{align*}
            $$
          answer: '£6083.26'
        - item: "Interest is compounded monthly"
          solution: |
            Using the formula with $P=5000, r=0.04, t=5, n=12$:

            $$
            \begin{align*}
            A &= 5000\left(1 + \frac{0.04}{12}\right)^{60} \\
            A &\approx 6104.98
            \end{align*}
            $$
          answer: '£6104.98'
        - item: "Interest is compounded continuously"
          solution: |
            Using the formula $A=Pe^{rt}$ with $P=5000, r=0.04, t=5$:

            $$
            \begin{align*}
            A &= 5000 \times e^{0.2} \\
            A &\approx 6107.01
            \end{align*}
            $$
          answer: '£6107.01'

    - question: |
        The value of an item is falling by 12% per year. Its price today is £250. Find the price after 8 years (to the nearest £) if:
      is_table_question: true
      table_items:
        - item: "The depreciation is compounded quarterly"
          solution: |
            Using the formula with $P=250, r=-0.12, t=8, n=4$:

            $$
            \begin{align*}
            A &= 250(0.97)^{32} \\
            A &\approx 94
            \end{align*}
            $$
          answer: '£94'
        - item: "The depreciation is compounded continuously"
          solution: |
            Using the formula $A=Pe^{rt}$ with $P=250, r=-0.12, t=8$:

            $$
            \begin{align*}
            A &= 250 \times e^{-0.96} \\
            A &\approx 96
            \end{align*}
            $$
          answer: '£96'

    - question: |
        Which of the options below will result in the greatest amount of return for a saver after 10 years? 
        
        [You may want to pick an amount to save, for example £1000]
        
        I. 8% compounded yearly
        
        II. 7.9% compounded monthly
        
        III. 7.8% compounded continuously
      solution: |
        Let's calculate the final amount for a principal ($P$) of £1000 over 10 years ($t=10$) for each option.

        **I. 8% compounded yearly ($r=0.08, n=1$)**
        $$ A = 1000(1.08)^{10} \approx 2158.92 $$

        **II. 7.9% compounded monthly ($r=0.079, n=12$)**
        $$ A = 1000\left(1+\frac{0.079}{12}\right)^{120} \approx 2197.70 $$

        **III. 7.8% compounded continuously ($r=0.078$)**
        $$ A = 1000e^{0.078 \times 10} \approx 2181.47 $$

        Comparing the three final amounts, the second option yields the highest return.
      answer: 'Option II (7.9% compounded monthly) gives the greatest return (£2197.70).'

    - question: |
        A saver has the option to invest a sum of money at 12% compounded each year, for 20 years. What is the lowest continuously compounded interest rate, to 1 decimal place, that will match this option?
      solution: |
        We need to find the rate $r$ where the outcomes are equal. Let $P$ be the principal.
        
        $$ P(1.12)^{20} = Pe^{20r} $$
        
        The principal $P$ cancels from both sides.
        
        $$ (1.12)^{20} = e^{20r} $$

        To solve for $r$, we take the natural logarithm (ln) of both sides.
        
        $$
        \begin{align*}
        \ln(1.12^{20}) &= \ln(e^{20r}) \\
        20 \ln(1.12) &= 20r \\
        r &= \ln(1.12) \\
        r &\approx 0.113328...
        \end{align*}
        $$
        As a percentage to one decimal place, this is 11.3%.
      answer: '11.3%'
