- section_title: "Solving by Factorisation (Part 1)"
  questions:
    - question: |
        Solve the following quadratic equation:
        $$x^2+8x+15=0$$
      solution: |
        To factorise this equation, we need two numbers that:
        - Multiply to give the constant term (**15**)
        - Add to give the x-coefficient (**8**)

        The two numbers are **5** and **3**.

        We can now rewrite the equation in factored form:
        $$ (x+5)(x+3) = 0 $$

        For the product to be zero, one of the brackets must equal zero:
        - $x+5=0 \implies x=-5$
        - $x+3=0 \implies x=-3$
      answer: '$x = -5$ or $x = -3$'

    - question: |
        Solve the following quadratic equation:
        $$x^2+2x-15=0$$
      solution: |
        We need two numbers that:
        - Multiply to give **-15**
        - Add to give **2**

        The two numbers are **5** and **-3**.

        Rewrite the equation in factored form:
        $$ (x+5)(x-3) = 0 $$

        This gives the solutions:
        - $x+5=0 \implies x=-5$
        - $x-3=0 \implies x=3$
      answer: '$x = -5$ or $x = 3$'

    - question: |
        Solve the following quadratic equation:
        $$x^2-5x-24=0$$
      solution: |
        We need two numbers that:
        - Multiply to give **-24**
        - Add to give **-5**

        The two numbers are **-8** and **3**.

        Rewrite the equation in factored form:
        $$ (x-8)(x+3) = 0 $$

        This gives the solutions:
        - $x-8=0 \implies x=8$
        - $x+3=0 \implies x=-3$
      answer: '$x = 8$ or $x = -3$'

    - question: |
        Solve the following quadratic equation:
        $$x^2+6x=0$$
      solution: |
        This equation has no constant term, so we can factor out the common term, which is **x**:
        $$ x(x+6) = 0 $$

        This gives two possible solutions:
        - $x=0$
        - $x+6=0 \implies x=-6$
      answer: '$x = 0$ or $x = -6$'

    - question: |
        Solve the following quadratic equation:
        $$x^2-10x+9=0$$
      solution: |
        We need two numbers that:
        - Multiply to give **9**
        - Add to give **-10**

        The two numbers are **-1** and **-9**.

        Rewrite the equation in factored form:
        $$ (x-1)(x-9) = 0 $$

        This gives the solutions:
        - $x-1=0 \implies x=1$
        - $x-9=0 \implies x=9$
      answer: '$x = 1$ or $x = 9$'

    - question: |
        Solve the following quadratic equation:
        $$x^2+x=30$$
      solution: |
        First, rearrange the equation so that it equals zero:
        $$ x^2+x-30 = 0 $$

        Now, find two numbers that:
        - Multiply to give **-30**
        - Add to give **1**

        The two numbers are **6** and **-5**.

        Rewrite the equation in factored form:
        $$ (x+6)(x-5) = 0 $$

        This gives the solutions:
        - $x+6=0 \implies x=-6$
        - $x-5=0 \implies x=5$
      answer: '$x = -6$ or $x = 5$'

- section_title: "Solving by Factorisation (Part 2)"
  questions:
    - question: |
        Solve the following quadratic equation:
        $$3x^2+7x+4=0$$
      solution: |
        For an equation of the form $ax^2+bx+c=0$, we look for two numbers that:
        - Multiply to give $a \times c \implies 3 \times 4 = 12$
        - Add to give $b \implies 7$

        The two numbers are **3** and **4**. We use these to split the middle term:
        $$ 3x^2+3x+4x+4=0 $$

        Now, factor by grouping:
        $$ 3x(x+1) + 4(x+1) = 0 $$
        $$ (3x+4)(x+1) = 0 $$

        This gives the solutions:
        - $3x+4=0 \implies x = -4/3$
        - $x+1=0 \implies x = -1$
      answer: '$x = -1$ or $x = -4/3$'

    - question: |
        Solve the following quadratic equation:
        $$5x^2+12x+4=0$$
      solution: |
        We need two numbers that:
        - Multiply to give $a \times c \implies 5 \times 4 = 20$
        - Add to give $b \implies 12$

        The two numbers are **10** and **2**. Split the middle term:
        $$ 5x^2+10x+2x+4=0 $$

        Factor by grouping:
        $$ 5x(x+2) + 2(x+2) = 0 $$
        $$ (5x+2)(x+2) = 0 $$

        This gives the solutions:
        - $5x+2=0 \implies x = -2/5$
        - $x+2=0 \implies x = -2$
      answer: '$x = -2$ or $x = -2/5$'

    - question: |
        Solve the following quadratic equation:
        $$6x^2+7x=5$$
      solution: |
        First, rearrange the equation to equal zero:
        $$ 6x^2+7x-5 = 0 $$

        We need two numbers that:
        - Multiply to give $a \times c \implies 6 \times -5 = -30$
        - Add to give $b \implies 7$

        The two numbers are **10** and **-3**. Split the middle term:
        $$ 6x^2+10x-3x-5=0 $$

        Factor by grouping:
        $$ 2x(3x+5) - 1(3x+5) = 0 $$
        $$ (2x-1)(3x+5) = 0 $$

        This gives the solutions:
        - $2x-1=0 \implies x = 1/2$
        - $3x+5=0 \implies x = -5/3$
      answer: '$x = 1/2$ or $x = -5/3$'

- section_title: "Solving using the Quadratic Formula"
  questions:
    - question: |
        Solve the following quadratic equation:
        $$x^2+5x+2=0$$
      solution: |
        This equation does not factorise easily, so we use the quadratic formula:
        $$ x = \frac{-b \pm \sqrt{b^2-4ac}}{2a} $$
        For this equation, $a=1$, $b=5$, and $c=2$.

        Substitute the values into the formula:
        $$ x = \frac{-5 \pm \sqrt{5^2-4(1)(2)}}{2(1)} $$
        $$ x = \frac{-5 \pm \sqrt{25-8}}{2} $$
        $$ x = \frac{-5 \pm \sqrt{17}}{2} $$
      answer: '$x = \frac{-5 + \sqrt{17}}{2}$ or $x = \frac{-5 - \sqrt{17}}{2}$'

    - question: |
        Solve the following quadratic equation:
        $$x^2+7x-1=0$$
      solution: |
        Using the quadratic formula where $a=1$, $b=7$, and $c=-1$:
        $$ x = \frac{-b \pm \sqrt{b^2-4ac}}{2a} $$
        $$ x = \frac{-7 \pm \sqrt{7^2-4(1)(-1)}}{2(1)} $$
        $$ x = \frac{-7 \pm \sqrt{49+4}}{2} $$
        $$ x = \frac{-7 \pm \sqrt{53}}{2} $$
      answer: '$x = \frac{-7 + \sqrt{53}}{2}$ or $x = \frac{-7 - \sqrt{53}}{2}$'

    - question: |
        Solve the following quadratic equation:
        $$3+5x-x^2=0$$
      solution: |
        First, rewrite in the standard form: $-x^2+5x+3=0$.
        Here, $a=-1$, $b=5$, and $c=3$.

        Using the quadratic formula:
        $$ x = \frac{-5 \pm \sqrt{5^2-4(-1)(3)}}{2(-1)} $$
        $$ x = \frac{-5 \pm \sqrt{25+12}}{-2} $$
        $$ x = \frac{-5 \pm \sqrt{37}}{-2} $$
        To simplify, multiply the numerator and denominator by -1:
        $$ x = \frac{5 \mp \sqrt{37}}{2} $$
      answer: '$x = \frac{5 + \sqrt{37}}{2}$ or $x = \frac{5 - \sqrt{37}}{2}$'

    - question: |
        Solve the following quadratic equation:
        $$4x^2-x=1$$
      solution: |
        First, rearrange to standard form: $4x^2-x-1=0$.
        Here, $a=4$, $b=-1$, and $c=-1$.

        Using the quadratic formula:
        $$ x = \frac{-(-1) \pm \sqrt{(-1)^2-4(4)(-1)}}{2(4)} $$
        $$ x = \frac{1 \pm \sqrt{1+16}}{8} $$
        $$ x = \frac{1 \pm \sqrt{17}}{8} $$
      answer: '$x = \frac{1 + \sqrt{17}}{8}$ or $x = \frac{1 - \sqrt{17}}{8}$'

- section_title: "Analysing Quadratic Functions"
  questions:
    - question: |
        For the function $y=x^2+9x+14$, find:
        1.  The point where the function crosses the $y$-axis.
        2.  The points where the function crosses the $x$-axis.
        3.  The range of $x$ for which $y > 0$.
      solution: |
        **1. Find the Y-axis Intercept**

        To find where the function crosses the y-axis, we set **$x=0$**:
        $$ y = (0)^2 + 9(0) + 14 $$
        $$ y = 14 $$
        The function crosses the y-axis at the point **(0, 14)**.

        ---
        **2. Find the X-axis Intercepts (Roots)**

        To find where the function crosses the x-axis, we set **$y=0$**:
        $$ x^2+9x+14=0 $$
        Factorising gives:
        $$ (x+7)(x+2)=0 $$
        The roots are $x=-7$ and $x=-2$. The intercept points are **(-7, 0)** and **(-2, 0)**.

        ---
        **3. Find the Range for y > 0**

        The coefficient of $x^2$ is **positive** (+1), so the parabola is U-shaped.
        The function is positive (above the x-axis) when it is *outside* of its roots.
        
        Therefore, $y > 0$ when **$x < -7$ or $x > -2$**.
      answer: '1. Y-intercept: (0, 14). 2. X-intercepts: (-7, 0) and (-2, 0). 3. Range for y > 0: $x < -7$ or $x > -2$.'

    - question: |
        For the function $y=x^2-3x+2$, find:
        1.  The point where the function crosses the $y$-axis.
        2.  The points where the function crosses the $x$-axis.
        3.  The range of $x$ for which $y > 0$.
      solution: |
        **1. Find the Y-axis Intercept**

        Set **$x=0$**:
        $$ y = (0)^2 - 3(0) + 2 = 2 $$
        The y-intercept is at **(0, 2)**.

        ---
        **2. Find the X-axis Intercepts (Roots)**

        Set **$y=0$**:
        $$ x^2-3x+2=0 $$
        Factorising gives:
        $$ (x-1)(x-2)=0 $$
        The roots are $x=1$ and $x=2$. The intercept points are **(1, 0)** and **(2, 0)**.

        ---
        **3. Find the Range for y > 0**

        The parabola is U-shaped. It is positive *outside* its roots.
        Therefore, $y > 0$ when **$x < 1$ or $x > 2$**.
      answer: '1. Y-intercept: (0, 2). 2. X-intercepts: (1, 0) and (2, 0). 3. Range for y > 0: $x < 1$ or $x > 2$.'

    - question: |
        For the function $y=x^2-8x+16$, find:
        1.  The point where the function crosses the $y$-axis.
        2.  The points where the function crosses the $x$-axis.
        3.  The range of $x$ for which $y > 0$.
      solution: |
        **1. Find the Y-axis Intercept**

        Set **$x=0$**:
        $$ y = (0)^2 - 8(0) + 16 = 16 $$
        The y-intercept is at **(0, 16)**.

        ---
        **2. Find the X-axis Intercepts (Roots)**

        Set **$y=0$**:
        $$ x^2-8x+16=0 $$
        This is a perfect square:
        $$ (x-4)^2=0 $$
        There is only one (repeated) root at $x=4$. The graph touches the x-axis at **(4, 0)**.

        ---
        **3. Find the Range for y > 0**

        The parabola is U-shaped and its vertex is on the x-axis at $x=4$.
        The value of y is positive for all values of $x$ *except* for $x=4$ (where $y=0$).
        Therefore, $y > 0$ for **all real numbers $x \neq 4$**.
      answer: '1. Y-intercept: (0, 16). 2. X-intercept: (4, 0). 3. Range for y > 0: All real numbers except $x=4$.'

    - question: |
        For the function $y=10+7x-x^2$, find:
        1.  The point where the function crosses the $y$-axis.
        2.  The points where the function crosses the $x$-axis.
        3.  The range of $x$ for which $y > 0$.
      solution: |
        **1. Find the Y-axis Intercept**

        Set **$x=0$**:
        $$ y = 10 + 7(0) - (0)^2 = 10 $$
        The y-intercept is at **(0, 10)**.

        ---
        **2. Find the X-axis Intercepts (Roots)**

        Set **$y=0$**: $10+7x-x^2=0$. Use the quadratic formula with $a=-1, b=7, c=10$:
        $$ x = \frac{-7 \pm \sqrt{7^2-4(-1)(10)}}{2(-1)} = \frac{-7 \pm \sqrt{49+40}}{-2} $$
        $$ x = \frac{-7 \pm \sqrt{89}}{-2} $$
        The roots are **$x = \frac{7 - \sqrt{89}}{2}$** and **$x = \frac{7 + \sqrt{89}}{2}$**.

        ---
        **3. Find the Range for y > 0**

        The coefficient of $x^2$ is **negative** (-1), so the parabola is n-shaped.
        The function is positive (above the x-axis) when it is *between* its roots.
        Therefore, $y > 0$ when **$\frac{7 - \sqrt{89}}{2} < x < \frac{7 + \sqrt{89}}{2}$**.
      answer: '1. Y-intercept: (0, 10). 2. X-intercepts: $(\frac{7 - \sqrt{89}}{2}, 0)$ and $(\frac{7 + \sqrt{89}}{2}, 0)$. 3. Range for y > 0: $\frac{7 - \sqrt{89}}{2} < x < \frac{7 + \sqrt{89}}{2}$.'

    - question: |
        For the function $y=x^2+6x-2$, find:
        1.  The point where the function crosses the $y$-axis.
        2.  The points where the function crosses the $x$-axis.
        3.  The range of $x$ for which $y > 0$.
      solution: |
        **1. Find the Y-axis Intercept**

        Set **$x=0$**:
        $$ y = (0)^2 + 6(0) - 2 = -2 $$
        The y-intercept is at **(0, -2)**.

        ---
        **2. Find the X-axis Intercepts (Roots)**

        Set **$y=0$**: $x^2+6x-2=0$. Use the quadratic formula with $a=1, b=6, c=-2$:
        $$ x = \frac{-6 \pm \sqrt{6^2-4(1)(-2)}}{2(1)} = \frac{-6 \pm \sqrt{36+8}}{2} $$
        $$ x = \frac{-6 \pm \sqrt{44}}{2} = \frac{-6 \pm 2\sqrt{11}}{2} $$
        $$ x = -3 \pm \sqrt{11} $$
        The roots are **$x = -3 - \sqrt{11}$** and **$x = -3 + \sqrt{11}$**.

        ---
        **3. Find the Range for y > 0**

        The parabola is U-shaped. It is positive *outside* its roots.
        Therefore, $y > 0$ when **$x < -3 - \sqrt{11}$ or $x > -3 + \sqrt{11}$**.
      answer: '1. Y-intercept: (0, -2). 2. X-intercepts: $(-3 - \sqrt{11}, 0)$ and $(-3 + \sqrt{11}, 0)$. 3. Range for y > 0: $x < -3 - \sqrt{11}$ or $x > -3 + \sqrt{11}$.'

    - question: |
        For the function $y=10-3x-2x^2$, find:
        1.  The point where the function crosses the $y$-axis.
        2.  The points where the function crosses the $x$-axis.
        3.  The range of $x$ for which $y > 0$.
      solution: |
        **1. Find the Y-axis Intercept**

        Set **$x=0$**:
        $$ y = 10 - 3(0) - 2(0)^2 = 10 $$
        The y-intercept is at **(0, 10)**.

        ---
        **2. Find the X-axis Intercepts (Roots)**

        Set **$y=0$**: $-2x^2-3x+10=0$. Use the quadratic formula with $a=-2, b=-3, c=10$:
        $$ x = \frac{-(-3) \pm \sqrt{(-3)^2-4(-2)(10)}}{2(-2)} = \frac{3 \pm \sqrt{9+80}}{-4} $$
        $$ x = \frac{3 \pm \sqrt{89}}{-4} $$
        The roots are **$x = \frac{-3 - \sqrt{89}}{4}$** and **$x = \frac{-3 + \sqrt{89}}{4}$**.

        ---
        **3. Find the Range for y > 0**

        The coefficient of $x^2$ is **negative** (-2), so the parabola is n-shaped.
        The function is positive (above the x-axis) when it is *between* its roots.
        Therefore, $y > 0$ when **$\frac{-3 - \sqrt{89}}{4} < x < \frac{-3 + \sqrt{89}}{4}$**.
      answer: '1. Y-intercept: (0, 10). 2. X-intercepts: $(\frac{-3 - \sqrt{89}}{4}, 0)$ and $(\frac{-3 + \sqrt{89}}{4}, 0)$. 3. Range for y > 0: $\frac{-3 - \sqrt{89}}{4} < x < \frac{-3 + \sqrt{89}}{4}$.'
