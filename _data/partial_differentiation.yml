- section_title: "Differentiation"
  questions:
    - question: |
        For each of the functions below, find the derived function, $\frac{dy}{dx}$.
      is_table_question: true
      table_items:
        - item: '$y=5x^3+10x-8$'
          solution: |
            $$ \frac{dy}{dx} = 15x^2 + 10 $$
          answer: '$\frac{dy}{dx} = 15x^2+10$'
        - item: '$y=\frac{10}{x^2}-5 \sqrt{x}$'
          solution: |
            Rewrite as $y=10x^{-2} - 5x^{1/2}$.
            
            $$ \frac{dy}{dx} = -20x^{-3} - \frac{5}{2}x^{-1/2} $$
          answer: '$\frac{dy}{dx} = -20x^{-3} - \frac{5}{2}x^{-1/2}$'
        - item: '$y=\ln(8x)$'
          solution: |
            Rewrite as $y = \ln(8) + \ln(x)$. The derivative of the constant $\ln(8)$ is 0.
            
            $$ \frac{dy}{dx} = \frac{1}{x} $$
          answer: '$\frac{dy}{dx} = \frac{1}{x}$'
        - item: '$y=e^{5x}+3e^{x^2}$'
          solution: |
            $$ \frac{dy}{dx} = 5e^{5x} + 6xe^{x^2} $$
          answer: '$\frac{dy}{dx} = 5e^{5x} + 6xe^{x^2}$'

- section_title: "Partial Derivatives"
  questions:
    - question: |
        For each of the functions below, find the six specified partial derivatives.
      is_table_question: true
      table_items:
        - item: '$z=e^{x^2-y^2}$'
          solution: |
            **First-Order Derivatives**

            Using the chain rule:
            
            $$ \frac{\partial z}{\partial x} = e^{x^2-y^2} \cdot (2x) = 2xe^{x^2-y^2} $$
            
            $$ \frac{\partial z}{\partial y} = e^{x^2-y^2} \cdot (-2y) = -2ye^{x^2-y^2} $$

            **Second-Order Derivatives**
            
            To find $\frac{\partial^2 z}{\partial x^2}$, we use the product rule on $2x e^{x^2-y^2}$:
            
            $$
            \begin{align*}
            \frac{\partial^2 z}{\partial x^2} &= (2)(e^{x^2-y^2}) + (2x)(2xe^{x^2-y^2}) \\
            &= 2e^{x^2-y^2} + 4x^2e^{x^2-y^2} \\
            &= 2e^{x^2-y^2}(1+2x^2)
            \end{align*}
            $$
            
            **Cross-Partial Derivatives**
            
            $$ \frac{\partial^2 z}{\partial y \partial x} = \frac{\partial}{\partial y}(2xe^{x^2-y^2}) = 2x \cdot e^{x^2-y^2}(-2y) = -4xye^{x^2-y^2} $$
            By Young's theorem, $\frac{\partial^2 z}{\partial x \partial y} = \frac{\partial^2 z}{\partial y \partial x}$.
          answer: 'See solution for all derivatives.'

- section_title: "Implicit Differentiation"
  questions:
    - question: |
        For each function, use implicit differentiation to find $\frac{dy}{dx}$.
      is_table_question: true
      table_items:
        - item: '$x^2+4y=0$'
          solution: |
            $$
            \begin{align*}
            2x + 4\frac{dy}{dx} &= 0 \\
            \frac{dy}{dx} &= -\frac{x}{2}
            \end{align*}
            $$
          answer: '$\frac{dy}{dx} = -\frac{x}{2}$'
        - item: '$x^2-y^2=0$'
          solution: |
            $$
            \begin{align*}
            2x - 2y\frac{dy}{dx} &= 0 \\
            \frac{dy}{dx} &= \frac{x}{y}
            \end{align*}
            $$
          answer: '$\frac{dy}{dx} = \frac{x}{y}$'
        - item: '$4xy+y^2=0$'
          solution: |
            Using the product rule on the $4xy$ term:
            $$
            \begin{align*}
            (4y + 4x\frac{dy}{dx}) + 2y\frac{dy}{dx} &= 0 \\
            \frac{dy}{dx}(4x+2y) &= -4y \\
            \frac{dy}{dx} &= -\frac{2y}{2x+y}
            \end{align*}
            $$
          answer: '$\frac{dy}{dx} = -\frac{2y}{2x+y}$'

- section_title: "Total Differential"
  questions:
    - question: |
        Find the total differential, $dz$, for each function.
      is_table_question: true
      table_items:
        - item: '$z=x^2+4y$'
          solution: |
            $\frac{\partial z}{\partial x} = 2x$ and $\frac{\partial z}{\partial y} = 4$.
          answer: '$dz = 2x \, dx + 4 \, dy$'
        - item: '$z=x^2-y^2$'
          solution: |
            $\frac{\partial z}{\partial x} = 2x$ and $\frac{\partial z}{\partial y} = -2y$.
          answer: '$dz = 2x \, dx - 2y \, dy$'
        - item: '$z=4xy+y^2$'
          solution: |
            $\frac{\partial z}{\partial x} = 4y$ and $\frac{\partial z}{\partial y} = 4x+2y$.
          answer: '$dz = 4y \, dx + (4x+2y) \, dy$'
        - item: '$z=\frac{4x^2}{y^3}$'
          solution: |
            $\frac{\partial z}{\partial x} = \frac{8x}{y^3}$ and $\frac{\partial z}{\partial y} = -\frac{12x^2}{y^4}$.
          answer: '$dz = \frac{8x}{y^3} \, dx - \frac{12x^2}{y^4} \, dy$'

    - question: |
        For each function in the previous question, use the total derivative to find $\frac{dy}{dx}$ for the implicit function $f(x,y)=0$. Confirm the first three match the 'Implicit Differentiation' section.
      solution: |
        The total differential is $dz = \frac{\partial z}{\partial x}dx + \frac{\partial z}{\partial y}dy$.

        If $f(x,y)=0$, then $z$ is constant, so its total change $dz$ must be 0.
        
        $$ 0 = \frac{\partial z}{\partial x}dx + \frac{\partial z}{\partial y}dy $$

        We rearrange this equation to find the slope, $\frac{dy}{dx}$:

        $$
        \begin{align*}
        -\frac{\partial z}{\partial y}dy &= \frac{\partial z}{\partial x}dx \\
        \frac{dy}{dx} &= - \frac{\partial z / \partial x}{\partial z / \partial y}
        \end{align*}
        $$
        
        **Applying this formula:**

        a) For $z=x^2+4y$:
        $\frac{dy}{dx} = - \frac{2x}{4} = -\frac{x}{2}$. This **matches**.

        b) For $z=x^2-y^2$:
        $\frac{dy}{dx} = - \frac{2x}{-2y} = \frac{x}{y}$. This **matches**.

        c) For $z=4xy+y^2$:
        $\frac{dy}{dx} = - \frac{4y}{4x+2y} = -\frac{2y}{2x+y}$. This **matches**.

        d) For $z=\frac{4x^2}{y^3}$:
        $\frac{dy}{dx} = - \frac{8x/y^3}{-12x^2/y^4} = \frac{2y}{3x}$.
      answer: 'See solution. The first three match the previous section.'
