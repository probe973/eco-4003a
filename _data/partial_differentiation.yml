- section_title: "Differentiation"
  questions:
    - question: |
        For each of the functions below, $y=f(x)$, find the derived function, $\frac{dy}{dx}=f'(x)$
      is_table_question: true
      table_items:
        - item: "$y=5x^3+10x-8$"
          solution: |
            Apply the power rule to each term: $\frac{d}{dx}(ax^n) = anx^{n-1}$. The derivative of a constant is 0.

            $$ \frac{dy}{dx} = 3 \cdot 5x^{3-1} + 1 \cdot 10x^{1-1} - 0 = 15x^2 + 10 $$
          answer: '$\frac{dy}{dx} = 15x^2+10$'
        - item: "$y=\frac{10}{x^2}-5 \sqrt{x}$"
          solution: |
            First, rewrite the function with negative and fractional exponents: $y=10x^{-2} - 5x^{1/2}$.

            Now, apply the power rule:
            $$ \frac{dy}{dx} = (-2) \cdot 10x^{-2-1} - (\frac{1}{2}) \cdot 5x^{1/2-1} = -20x^{-3} - \frac{5}{2}x^{-1/2} $$
          answer: '$\frac{dy}{dx} = -20x^{-3} - \frac{5}{2}x^{-1/2}$'
        - item: "$y=\ln(8x)$"
          solution: |
            Use the chain rule. The derivative of $\ln(u)$ is $\frac{1}{u} \cdot u'$. Here, $u=8x$, so $u'=8$.

            $$ \frac{dy}{dx} = \frac{1}{8x} \cdot 8 = \frac{1}{x} $$
          answer: '$\frac{dy}{dx} = \frac{1}{x}$'
        - item: "$y=e^{5x}+3e^{x^2}$"
          solution: |
            Use the chain rule for each term. The derivative of $e^u$ is $e^u \cdot u'$.

            For $e^{5x}$, $u=5x$ and $u'=5$.
            For $3e^{x^2}$, $u=x^2$ and $u'=2x$.

            $$ \frac{dy}{dx} = e^{5x}(5) + 3e^{x^2}(2x) = 5e^{5x} + 6xe^{x^2} $$
          answer: '$\frac{dy}{dx} = 5e^{5x} + 6xe^{x^2}$'

- section_title: "Partial Derivatives"
  questions:
    - question: |
        For each of the functions below, $z=f(x,y)$, find:
        $$ \frac{\partial z}{\partial x}, \quad \frac{\partial z}{\partial y}, \quad \frac{\partial^2 z}{\partial x^2}, \quad \frac{\partial^2 z}{\partial y^2}, \quad \frac{\partial^2 z}{\partial y \partial x}, \quad \frac{\partial^2 z}{\partial x \partial y} $$
      is_table_question: true
      table_items:
        - item: "$z=x^2-y^2$"
          solution: |
            $\frac{\partial z}{\partial x} = 2x$
            
            $\frac{\partial z}{\partial y} = -2y$
            
            $\frac{\partial^2 z}{\partial x^2} = \frac{\partial}{\partial x}(2x) = 2$
            
            $\frac{\partial^2 z}{\partial y^2} = \frac{\partial}{\partial y}(-2y) = -2$
            
            $\frac{\partial^2 z}{\partial y \partial x} = \frac{\partial}{\partial y}(2x) = 0$
            
            $\frac{\partial^2 z}{\partial x \partial y} = \frac{\partial}{\partial x}(-2y) = 0$
          answer: 'See solution for all 6 derivatives.'
        - item: "$z=5x+3x^2-2y^3$"
          solution: |
            $\frac{\partial z}{\partial x} = 5+6x$
            
            $\frac{\partial z}{\partial y} = -6y^2$
            
            $\frac{\partial^2 z}{\partial x^2} = 6$
            
            $\frac{\partial^2 z}{\partial y^2} = -12y$
            
            $\frac{\partial^2 z}{\partial y \partial x} = 0$
            
            $\frac{\partial^2 z}{\partial x \partial y} = 0$
          answer: 'See solution for all 6 derivatives.'
        - item: "$z=x^2y^3+8x-4$"
          solution: |
            $\frac{\partial z}{\partial x} = 2xy^3+8$
            
            $\frac{\partial z}{\partial y} = 3x^2y^2$
            
            $\frac{\partial^2 z}{\partial x^2} = 2y^3$
            
            $\frac{\partial^2 z}{\partial y^2} = 6x^2y$
            
            $\frac{\partial^2 z}{\partial y \partial x} = \frac{\partial}{\partial y}(2xy^3+8) = 6xy^2$
            
            $\frac{\partial^2 z}{\partial x \partial y} = \frac{\partial}{\partial x}(3x^2y^2) = 6xy^2$
          answer: 'See solution for all 6 derivatives.'
        - item: "$z=e^{x^2-y^2}$"
          solution: |
            Using the chain rule, where the inner function is $u=x^2-y^2$.
            
            $\frac{\partial z}{\partial x} = e^{x^2-y^2} \cdot (2x) = 2xe^{x^2-y^2}$
            
            $\frac{\partial z}{\partial y} = e^{x^2-y^2} \cdot (-2y) = -2ye^{x^2-y^2}$
            
            $\frac{\partial^2 z}{\partial x^2} = \frac{\partial}{\partial x}(2xe^{x^2-y^2}) = (2)(e^{x^2-y^2}) + (2x)(2xe^{x^2-y^2}) = 2e^{x^2-y^2}(1+2x^2)$
            
            $\frac{\partial^2 z}{\partial y^2} = \frac{\partial}{\partial y}(-2ye^{x^2-y^2}) = (-2)(e^{x^2-y^2}) + (-2y)(-2ye^{x^2-y^2}) = 2e^{x^2-y^2}(2y^2-1)$
            
            $\frac{\partial^2 z}{\partial y \partial x} = \frac{\partial}{\partial y}(2xe^{x^2-y^2}) = 2x \cdot e^{x^2-y^2}(-2y) = -4xye^{x^2-y^2}$
            
            $\frac{\partial^2 z}{\partial x \partial y} = \frac{\partial}{\partial x}(-2ye^{x^2-y^2}) = -2y \cdot e^{x^2-y^2}(2x) = -4xye^{x^2-y^2}$
          answer: 'See solution for all 6 derivatives.'

- section_title: "Implicit Differentiation"
  questions:
    - question: |
        For each of the functions below, use implicit differentiation to find an expression for $\frac{dy}{dx}$
      is_table_question: true
      table_items:
        - item: "$x^2+4y=0$"
          solution: |
            Differentiate each term with respect to $x$. Remember to use the chain rule for terms involving $y$.
            
            $$
            \begin{align*}
            \frac{d}{dx}(x^2) + \frac{d}{dx}(4y) &= \frac{d}{dx}(0) \\
            2x + 4\frac{dy}{dx} &= 0 \\
            4\frac{dy}{dx} &= -2x \\
            \frac{dy}{dx} &= -\frac{2x}{4} = -\frac{x}{2}
            \end{align*}
            $$
          answer: '$\frac{dy}{dx} = -\frac{x}{2}$'
        - item: "$x^2-y^2=0$"
          solution: |
            Differentiate each term with respect to $x$.
            
            $$
            \begin{align*}
            2x - 2y\frac{dy}{dx} &= 0 \\
            2x &= 2y\frac{dy}{dx} \\
            \frac{dy}{dx} &= \frac{2x}{2y} = \frac{x}{y}
            \end{align*}
            $$
          answer: '$\frac{dy}{dx} = \frac{x}{y}$'
        - item: "$4xy+y^2=0$"
          solution: |
            Use the product rule for the $4xy$ term.
            
            $$
            \begin{align*}
            \left[ (4)(y) + (4x)(\frac{dy}{dx}) \right] + 2y\frac{dy}{dx} &= 0 \\
            4y + 4x\frac{dy}{dx} + 2y\frac{dy}{dx} &= 0 \\
            \frac{dy}{dx}(4x+2y) &= -4y \\
            \frac{dy}{dx} &= -\frac{4y}{4x+2y} = -\frac{2y}{2x+y}
            \end{align*}
            $$
          answer: '$\frac{dy}{dx} = -\frac{2y}{2x+y}$'

- section_title: "Total Differential"
  questions:
    - question: |
        Find the total differential, $dz$, of $z=f(x,y)$ using $dz=\frac{\partial z}{\partial x}dx+\frac{\partial z}{\partial y}dy$
      is_table_question: true
      table_items:
        - item: "$z=x^2+4y$"
          solution: |
            First, find the partial derivatives:
            
            $\frac{\partial z}{\partial x} = 2x$
            
            $\frac{\partial z}{\partial y} = 4$
            
            Substitute these into the formula for the total differential.
          answer: '$dz = 2x \, dx + 4 \, dy$'
        - item: "$z=x^2-y^2$"
          solution: |
            First, find the partial derivatives:
            
            $\frac{\partial z}{\partial x} = 2x$
            
            $\frac{\partial z}{\partial y} = -2y$
            
            Substitute into the formula.
          answer: '$dz = 2x \, dx - 2y \, dy$'
        - item: "$z=4xy+y^2$"
          solution: |
            First, find the partial derivatives:
            
            $\frac{\partial z}{\partial x} = 4y$
            
            $\frac{\partial z}{\partial y} = 4x+2y$
            
            Substitute into the formula.
          answer: '$dz = 4y \, dx + (4x+2y) \, dy$'
        - item: "$z=\frac{4x^2}{y^3}$"
          solution: |
            Rewrite as $z=4x^2y^{-3}$. Find the partial derivatives:
            
            $\frac{\partial z}{\partial x} = 8xy^{-3} = \frac{8x}{y^3}$
            
            $\frac{\partial z}{\partial y} = -12x^2y^{-4} = -\frac{12x^2}{y^4}$
            
            Substitute into the formula.
          answer: '$dz = \frac{8x}{y^3} \, dx - \frac{12x^2}{y^4} \, dy$'

    - question: |
        For each of the functions in question 4, use the total derivative of $z=f(x,y)$ to find $\frac{dy}{dx}$ for the implicit function defined by $f(x,y)=0$.

        Confirm that a to c match with the answers to question 3.
      solution: |
        The formula for the total derivative is $\frac{dy}{dx} = - \frac{\partial z / \partial x}{\partial z / \partial y}$. We use the partial derivatives calculated in the previous question.

        **a) For $z=x^2+4y$**
        
        $$ \frac{dy}{dx} = - \frac{2x}{4} = -\frac{x}{2} $$
        This **matches** the answer to 3(a).

        **b) For $z=x^2-y^2$**

        $$ \frac{dy}{dx} = - \frac{2x}{-2y} = \frac{x}{y} $$
        This **matches** the answer to 3(b).

        **c) For $z=4xy+y^2$**

        $$ \frac{dy}{dx} = - \frac{4y}{4x+2y} = -\frac{2y}{2x+y} $$
        This **matches** the answer to 3(c).

        **d) For $z=\frac{4x^2}{y^3}$**

        $$ \frac{dy}{dx} = - \frac{8x/y^3}{-12x^2/y^4} = - \left( \frac{8x}{y^3} \right) \cdot \left( -\frac{y^4}{12x^2} \right) = \frac{8xy^4}{12x^2y^3} = \frac{2y}{3x} $$
      answer: 'a) $-\frac{x}{2}$, b) $\frac{x}{y}$, c) $-\frac{2y}{2x+y}$, d) $\frac{2y}{3x}$. The first three match the answers from question 3.'
