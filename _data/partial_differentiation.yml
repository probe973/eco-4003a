- section_title: "Differentiation"
  questions:
    - question: |
        For each of the functions below, $y=f(x)$, find the derived function, $\frac{dy}{dx}=f'(x)$
      is_table_question: true
      table_items:
        - item: '$y=5x^3+10x-8$'
          solution: |
            Apply the power rule to each term.
            $$ \frac{dy}{dx} = 15x^2 + 10 $$
          answer: '$\frac{dy}{dx} = 15x^2+10$'
        - item: '$y=\frac{10}{x^2}-5 \sqrt{x}$'
          solution: |
            Rewrite as $y=10x^{-2} - 5x^{1/2}$ and apply the power rule.
            $$ \frac{dy}{dx} = -20x^{-3} - \frac{5}{2}x^{-1/2} $$
          answer: '$\frac{dy}{dx} = -20x^{-3} - \frac{5}{2}x^{-1/2}$'
        - item: '$y=\ln(8x)$'
          solution: |
            Use the chain rule: $\frac{d}{dx}(\ln u) = \frac{u'}{u}$.
            $$ \frac{dy}{dx} = \frac{8}{8x} = \frac{1}{x} $$
          answer: '$\frac{dy}{dx} = \frac{1}{x}$'
        - item: '$y=e^{5x}+3e^{x^2}$'
          solution: |
            Use the chain rule for each term: $\frac{d}{dx}(e^u) = e^u \cdot u'$.
            $$ \frac{dy}{dx} = 5e^{5x} + 3e^{x^2}(2x) = 5e^{5x} + 6xe^{x^2} $$
          answer: '$\frac{dy}{dx} = 5e^{5x} + 6xe^{x^2}$'

- section_title: "Partial Derivatives"
  questions:
    - question: |
        For each of the functions below, $z=f(x,y)$, find:
        $$ \frac{\partial z}{\partial x}, \quad \frac{\partial z}{\partial y}, \quad \frac{\partial^2 z}{\partial x^2}, \quad \frac{\partial^2 z}{\partial y^2}, \quad \frac{\partial^2 z}{\partial y \partial x}, \quad \frac{\partial^2 z}{\partial x \partial y} $$
      is_table_question: true
      table_items:
        - item: '$z=x^2-y^2$'
          solution: |
            $\frac{\partial z}{\partial x} = 2x$
            
            $\frac{\partial z}{\partial y} = -2y$
            
            $\frac{\partial^2 z}{\partial x^2} = 2$
            
            $\frac{\partial^2 z}{\partial y^2} = -2$
            
            $\frac{\partial^2 z}{\partial y \partial x} = 0$
            
            $\frac{\partial^2 z}{\partial x \partial y} = 0$
          answer: 'See solution for all 6 derivatives.'
        - item: '$z=5x+3x^2-2y^3$'
          solution: |
            $\frac{\partial z}{\partial x} = 5+6x$
            
            $\frac{\partial z}{\partial y} = -6y^2$
            
            $\frac{\partial^2 z}{\partial x^2} = 6$
            
            $\frac{\partial^2 z}{\partial y^2} = -12y$
            
            $\frac{\partial^2 z}{\partial y \partial x} = 0$
            
            $\frac{\partial^2 z}{\partial x \partial y} = 0$
          answer: 'See solution for all 6 derivatives.'
        - item: '$z=xy$'
          solution: |
            $\frac{\partial z}{\partial x} = y$
            
            $\frac{\partial z}{\partial y} = x$
            
            $\frac{\partial^2 z}{\partial x^2} = 0$
            
            $\frac{\partial^2 z}{\partial y^2} = 0$
            
            $\frac{\partial^2 z}{\partial y \partial x} = 1$
            
            $\frac{\partial^2 z}{\partial x \partial y} = 1$
          answer: 'See solution for all 6 derivatives.'
        - item: '$z=x^2y^3+8x-4$'
          solution: |
            $\frac{\partial z}{\partial x} = 2xy^3+8$
            
            $\frac{\partial z}{\partial y} = 3x^2y^2$
            
            $\frac{\partial^2 z}{\partial x^2} = 2y^3$
            
            $\frac{\partial^2 z}{\partial y^2} = 6x^2y$
            
            $\frac{\partial^2 z}{\partial y \partial x} = 6xy^2$
            
            $\frac{\partial^2 z}{\partial x \partial y} = 6xy^2$
          answer: 'See solution for all 6 derivatives.'
        - item: '$z=\frac{x^2}{y^2}$'
          solution: |
            Rewrite as $z=x^2y^{-2}$.
            
            $\frac{\partial z}{\partial x} = 2xy^{-2}$
            
            $\frac{\partial z}{\partial y} = -2x^2y^{-3}$
            
            $\frac{\partial^2 z}{\partial x^2} = 2y^{-2}$
            
            $\frac{\partial^2 z}{\partial y^2} = 6x^2y^{-4}$
            
            $\frac{\partial^2 z}{\partial y \partial x} = -4xy^{-3}$
            
            $\frac{\partial^2 z}{\partial x \partial y} = -4xy^{-3}$
          answer: 'See solution for all 6 derivatives.'
        - item: '$z=\ln(xy)$'
          solution: |
            Rewrite as $z=\ln x + \ln y$.
            
            $\frac{\partial z}{\partial x} = 1/x$
            
            $\frac{\partial z}{\partial y} = 1/y$
            
            $\frac{\partial^2 z}{\partial x^2} = -x^{-2}$
            
            $\frac{\partial^2 z}{\partial y^2} = -y^{-2}$
            
            $\frac{\partial^2 z}{\partial y \partial x} = 0$
            
            $\frac{\partial^2 z}{\partial x \partial y} = 0$
          answer: 'See solution for all 6 derivatives.'
        - item: '$z=e^x+5e^{2y}$'
          solution: |
            $\frac{\partial z}{\partial x} = e^x$
            
            $\frac{\partial z}{\partial y} = 10e^{2y}$
            
            $\frac{\partial^2 z}{\partial x^2} = e^x$
            
            $\frac{\partial^2 z}{\partial y^2} = 20e^{2y}$
            
            $\frac{\partial^2 z}{\partial y \partial x} = 0$
            
            $\frac{\partial^2 z}{\partial x \partial y} = 0$
          answer: 'See solution for all 6 derivatives.'
        - item: '$z=x^2y-ye^x+xe^{-2y}$'
          solution: |
            $\frac{\partial z}{\partial x} = 2xy-ye^x+e^{-2y}$
            
            $\frac{\partial z}{\partial y} = x^2-e^x-2xe^{-2y}$
            
            $\frac{\partial^2 z}{\partial x^2} = 2y-ye^x$
            
            $\frac{\partial^2 z}{\partial y^2} = 4xe^{-2y}$
            
            $\frac{\partial^2 z}{\partial y \partial x} = 2x-e^x-2e^{-2y}$
            
            $\frac{\partial^2 z}{\partial x \partial y} = 2x-e^x-2e^{-2y}$
          answer: 'See solution for all 6 derivatives.'
        - item: '$z=e^{x^2-y^2}$'
          solution: |
            $\frac{\partial z}{\partial x} = 2xe^{x^2-y^2}$
            
            $\frac{\partial z}{\partial y} = -2ye^{x^2-y^2}$
            
            $\frac{\partial^2 z}{\partial x^2} = 2e^{x^2-y^2}(1+2x^2)$
            
            $\frac{\partial^2 z}{\partial y^2} = 2e^{x^2-y^2}(2y^2-1)$
            
            $\frac{\partial^2 z}{\partial y \partial x} = -4xye^{x^2-y^2}$
            
            $\frac{\partial^2 z}{\partial x \partial y} = -4xye^{x^2-y^2}$
          answer: 'See solution for all 6 derivatives.'

- section_title: "Implicit Differentiation"
  questions:
    - question: |
        For each of the functions below, use implicit differentiation to find an expression for $\frac{dy}{dx}$
      is_table_question: true
      table_items:
        - item: '$x^2+4y=0$'
          solution: |
            $2x + 4\frac{dy}{dx} = 0 \implies \frac{dy}{dx} = -\frac{2x}{4}$
          answer: '$\frac{dy}{dx} = -\frac{x}{2}$'
        - item: '$x^2-y^2=0$'
          solution: |
            $2x - 2y\frac{dy}{dx} = 0 \implies \frac{dy}{dx} = \frac{2x}{2y}$
          answer: '$\frac{dy}{dx} = \frac{x}{y}$'
        - item: '$4xy+y^2=0$'
          solution: |
            $(4y + 4x\frac{dy}{dx}) + 2y\frac{dy}{dx} = 0 \implies \frac{dy}{dx}(4x+2y) = -4y$
          answer: '$\frac{dy}{dx} = -\frac{2y}{2x+y}$'

- section_title: "Total Differential"
  questions:
    - question: |
        Find the total differential, $dz$, of $z=f(x,y)$ using $dz=\frac{\partial z}{\partial x}dx+\frac{\partial z}{\partial y}dy$
      is_table_question: true
      table_items:
        - item: '$z=x^2+4y$'
          solution: |
            $\frac{\partial z}{\partial x} = 2x$ and $\frac{\partial z}{\partial y} = 4$.
          answer: '$dz = 2x \, dx + 4 \, dy$'
        - item: '$z=x^2-y^2$'
          solution: |
            $\frac{\partial z}{\partial x} = 2x$ and $\frac{\partial z}{\partial y} = -2y$.
          answer: '$dz = 2x \, dx - 2y \, dy$'
        - item: '$z=4xy+y^2$'
          solution: |
            $\frac{\partial z}{\partial x} = 4y$ and $\frac{\partial z}{\partial y} = 4x+2y$.
          answer: '$dz = 4y \, dx + (4x+2y) \, dy$'
        - item: '$z=\frac{4x^2}{y^3}$'
          solution: |
            Rewrite as $z=4x^2y^{-3}$.
            
            $\frac{\partial z}{\partial x} = \frac{8x}{y^3}$ and $\frac{\partial z}{\partial y} = -\frac{12x^2}{y^4}$.
          answer: '$dz = \frac{8x}{y^3} \, dx - \frac{12x^2}{y^4} \, dy$'

    - question: |
        For each of the functions in question 4, use the total derivative of $z=f(x,y)$ to find $\frac{dy}{dx}$ for the implicit function defined by $f(x,y)=0$.

        Confirm that a to c match with the answers to question 3.
      solution: |
        The formula is $\frac{dy}{dx} = - \frac{\partial z / \partial x}{\partial z / \partial y}$.

        **a) For $z=x^2+4y$**: $\frac{dy}{dx} = - \frac{2x}{4} = -\frac{x}{2}$. This **matches** 3(a).

        **b) For $z=x^2-y^2$**: $\frac{dy}{dx} = - \frac{2x}{-2y} = \frac{x}{y}$. This **matches** 3(b).

        **c) For $z=4xy+y^2$**: $\frac{dy}{dx} = - \frac{4y}{4x+2y} = -\frac{2y}{2x+y}$. This **matches** 3(c).

        **d) For $z=\frac{4x^2}{y^3}$**: $\frac{dy}{dx} = - \frac{8x/y^3}{-12x^2/y^4} = \frac{8x}{y^3} \cdot \frac{y^4}{12x^2} = \frac{2y}{3x}$.
      answer: 'a) $-\frac{x}{2}$, b) $\frac{x}{y}$, c) $-\frac{2y}{2x+y}$, d) $\frac{2y}{3x}$. The first three match the answers from question 3.'
